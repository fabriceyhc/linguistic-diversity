name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        python -m spacy download en_core_web_sm
        python -m nltk.downloader -q stopwords cmudict averaged_perceptron_tagger_eng punkt

    - name: Lint with ruff
      run: |
        ruff check src/ tests/

    - name: Check formatting with black
      run: |
        black --check src/ tests/

    # Advisory while annotations are completed: the public metric classes are
    # typed, but the aggregation modules (universal.py, selection.py) still carry
    # ~100 errors. Surfaced in the log, not yet gating the build.
    - name: Type check with mypy (advisory)
      continue-on-error: true
      run: |
        mypy src/

    - name: Run tests
      run: |
        pytest tests/ -v --cov=linguistic_diversity --cov-report=xml --cov-report=term -m "not slow"

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  test-slow:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,phonological]"
        python -m spacy download en_core_web_sm
        python -m nltk.downloader -q stopwords cmudict averaged_perceptron_tagger_eng punkt

    - name: Run slow tests
      run: |
        pytest tests/ -v -m "slow" --durations=10
