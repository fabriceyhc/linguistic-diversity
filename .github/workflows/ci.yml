name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Only the newest commit on a branch is worth testing. Without this, pushes stack
# up behind each other -- macOS runners in particular queue for a long time, so a
# superseded run can still be waiting when two more have been pushed on top of it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Lint, formatting and type checking are properties of the source, not of the
  # interpreter, so they run once rather than 12 times inside the test matrix.
  # mypy in particular must be pinned to one environment: numpy's stubs became
  # shape-aware in 2.5 (Python 3.12+ only), so the same source produces different
  # errors depending on which numpy the interpreter resolves.
  quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with ruff
      run: ruff check src/ tests/

    - name: Check formatting with black
      run: black --check src/ tests/

    - name: Type check with mypy
      run: mypy src/

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        python -m spacy download en_core_web_sm
        python -m nltk.downloader -q stopwords cmudict averaged_perceptron_tagger_eng punkt

    - name: Run tests
      run: |
        pytest tests/ -v --cov=linguistic_diversity --cov-report=xml --cov-report=term -m "not slow"

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  test-slow:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev,phonological]"
        python -m spacy download en_core_web_sm
        python -m nltk.downloader -q stopwords cmudict averaged_perceptron_tagger_eng punkt

    - name: Run slow tests
      run: |
        pytest tests/ -v -m "slow" --durations=10
